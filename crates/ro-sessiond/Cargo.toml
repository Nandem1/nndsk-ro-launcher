[package]
name = "ro-sessiond"
version = "0.1.0"
edition = "2021"

[features]
orphan-worker = []

[[bin]]
name = "ro-sessiond"
path = "src/main.rs"

[[bin]]
name = "orphan-worker"
path = "src/bin/orphan_worker.rs"
required-features = ["orphan-worker"]

[dependencies]
libc = "0.2"
serde_json = "1"
signal-hook = "0.3"
ro-session-protocol = { path = "../ro-session-protocol" }

[dev-dependencies]
ro-tools-linux = { path = "../ro-tools-linux" }

[[test]]
name = "orphan_reparent"
path = "tests/orphan_reparent.rs"
harness = false
required-features = ["orphan-worker"]
