<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RO-Launcher</title>
  <!-- Pre-paint background. It must sit in Tailwind's base layer (same layer order as the
       bundle) so the stylesheet's body rule still wins once it loads. -->
  <style>@layer properties, theme, base, components, utilities; @layer base { html,body,#root{background:#09090b;height:100%} }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
