name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ubuntu-24.04
          cache-on-failure: true

      - uses: ./.github/actions/linux-build-deps

      - run: npm ci
      - run: node scripts/check-release-invariants.mjs
      - run: npm run check:design
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: cargo fmt --all -- --check
      - name: Build sidecars
        run: cargo build -p ro-inputd -p ro-sessiond
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # A tag can only restore caches saved on its own ref or on the default branch, so the
  # release build cache must be produced here. This job compiles exactly what release.yml
  # compiles (debug sidecars + clippy, cargo-audit, release sidecars, release app, smoke suite)
  # under the cache key that release.yml restores. Both jobs install Rust from
  # rust-toolchain.toml; rust-cache also keys on rustc identity. release.yml refuses to
  # run unless this whole workflow is green for the tagged commit, so the cache is
  # always saved before a tag uses it.
  release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-ubuntu-24.04

      - uses: ./.github/actions/linux-build-deps

      - run: npm ci
      - run: npm run build
      - run: node scripts/check-toolchain-invariants.mjs
      - name: Build sidecars
        run: cargo build -p ro-inputd -p ro-sessiond
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build release sidecars
        run: cargo build -p ro-inputd -p ro-sessiond --release
      - name: Build release app without bundling
        run: npx --no-install tauri build --no-bundle --config '{"bundle":{"createUpdaterArtifacts":false}}'
      # release.yml installs cargo-audit and runs the orphan_reparent suite against the
      # sidecar extracted from the AppImage; warm both here.
      - run: cargo install cargo-audit --locked --version 0.22.2
      - name: Build release smoke suite
        run: cargo test -p ro-sessiond --all-features --test orphan_reparent --no-run
