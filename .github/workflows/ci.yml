name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ubuntu-24.04
          cache-on-failure: true

      - uses: ./.github/actions/linux-build-deps

      - run: npm ci
      - run: node scripts/check-release-invariants.mjs
      - run: npm run check:design
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: cargo fmt --all -- --check
      - name: Build sidecars
        run: cargo build -p ro-inputd -p ro-sessiond
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # A tag can only restore caches saved on its own ref or on the default branch, so the
  # release build cache must be produced here. This job compiles exactly what release.yml
  # compiles (debug sidecars + clippy, release sidecars, release app) under the cache key
  # that release.yml restores. release.yml refuses to run unless this whole workflow is
  # green for the tagged commit, so the cache is always saved before a tag uses it.
  release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-ubuntu-24.04

      - uses: ./.github/actions/linux-build-deps

      - run: npm ci
      - run: npm run build
      - name: Build sidecars
        run: cargo build -p ro-inputd -p ro-sessiond
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build release sidecars
        run: cargo build -p ro-inputd -p ro-sessiond --release
      - name: Build release app without bundling
        run: npx tauri build --no-bundle
