name: Dependency audit

# PR dependency gate and scheduled early warning. The same policy gates every release.
# Policy (scripts/dependency-audit-policy.mjs): runtime npm advisories >= moderate, dev-only npm
# criticals and every RustSec vulnerability fail the job. Other advisories are listed in the job
# summary and as warning annotations. A crashed or unparseable audit fails the job; there is no
# continue-on-error here on purpose.
# Run on every PR so npm-dependency-audit and rustsec-dependency-audit can safely become
# required checks later: path-filtered workflows leave required checks Pending on skipped PRs.
# This prepares the checks; it does not enable branch protection or a ruleset.

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1'

permissions:
  contents: read

jobs:
  npm:
    name: npm-dependency-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-toolchain-invariants.mjs
      # The audit reads package-lock.json; installing (and running install scripts) is not needed.
      - run: node scripts/dependency-audit-policy.mjs npm

  rustsec:
    name: rustsec-dependency-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install repository Rust toolchain
        run: rustup self update && rustup toolchain install --no-self-update
      - run: node scripts/check-toolchain-invariants.mjs
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cargo-audit
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: node scripts/dependency-audit-policy.mjs cargo
