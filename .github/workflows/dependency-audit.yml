name: Dependency audit

# Scheduled early warning. The same policy also gates every release in release.yml.
# Policy (scripts/dependency-audit-policy.mjs): runtime npm advisories >= moderate, dev-only npm
# criticals and every RustSec vulnerability fail the job. Other advisories are listed in the job
# summary and as warning annotations. A crashed or unparseable audit fails the job; there is no
# continue-on-error here on purpose.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1'

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-toolchain-invariants.mjs
      # The audit reads package-lock.json; installing (and running install scripts) is not needed.
      - run: node scripts/dependency-audit-policy.mjs npm

  rustsec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: node scripts/check-toolchain-invariants.mjs
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cargo-audit
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: node scripts/dependency-audit-policy.mjs cargo
