name: Release

# build (no secrets) -> smoke the exact AppImage -> sign (only job with the key) -> publish draft.
#
# The AppImage that passes the smoke test is uploaded once as a workflow artifact and its SHA-256
# travels through job outputs. sign and publish re-check that hash, so the published bytes are the
# tested bytes. The signing key is referenced in exactly one step of the sign job, which runs only
# the Tauri CLI signer; no npm install script, build.rs, Vite or cargo build runs with it.
#
# Every `uses:` is pinned to a full commit SHA. To update one, resolve the tag you reviewed and
# replace both the SHA and the trailing comment, for example:
#   git ls-remote https://github.com/actions/checkout 'refs/tags/v4^{}' 'refs/tags/v4'
# Use the peeled `^{}` commit when the tag is annotated. See docs/features/UPDATER.md.

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reads the public Discord Application ID from the `release` environment. It runs no repository
  # code and no third-party action, and references no secret.
  release-config:
    runs-on: ubuntu-24.04
    environment: release
    permissions: {}
    outputs:
      discord_application_id: ${{ steps.config.outputs.discord_application_id }}
    steps:
      - id: config
        env:
          DISCORD_ID: ${{ vars.RO_LAUNCHER_DISCORD_APPLICATION_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$DISCORD_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::release environment variable RO_LAUNCHER_DISCORD_APPLICATION_ID must be numeric"
            exit 1
          fi
          echo "discord_application_id=$DISCORD_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: release-config
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.artifact.outputs.version }}
      appimage: ${{ steps.artifact.outputs.appimage }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The full quality gate (tests included) already ran in ci.yml for this commit.
      # Require that evidence instead of repeating it; it also guarantees the release
      # cache from ci.yml's release-cache job was saved.
      - name: Require green CI on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          green=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&status=success" \
            --jq '.total_count')
          if [[ "$green" -lt 1 ]]; then
            echo "::error::ci.yml has no successful push run on main for ${GITHUB_SHA}; wait for CI before tagging"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Warmed by the release-cache job of ci.yml on main. A tag-scoped cache could
          # not be restored by the next tag, so never save one from here.
          shared-key: release-ubuntu-24.04
          save-if: false

      - uses: ./.github/actions/linux-build-deps

      - name: Fail closed on release environment
        env:
          RO_LAUNCHER_DISCORD_APPLICATION_ID: ${{ needs.release-config.outputs.discord_application_id }}
        run: node scripts/require-release-env.mjs

      - run: node scripts/check-release-invariants.mjs
      - name: Tag matches version files
        run: node scripts/check-release-invariants.mjs --tag "${GITHUB_REF_NAME}"

      - name: Runtime dependency audit (npm)
        run: node scripts/dependency-audit-policy.mjs npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: cargo fmt --all -- --check
      - name: Build sidecars
        run: cargo build -p ro-inputd -p ro-sessiond
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: RustSec audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          node scripts/dependency-audit-policy.mjs cargo
      - name: Build release sidecars
        run: cargo build -p ro-inputd -p ro-sessiond --release

      # Unsigned on purpose: the updater signature is produced by the sign job. Overriding
      # createUpdaterArtifacts only skips the in-build signer; the AppImage bytes are the same
      # updater artifact that tauri build would have signed.
      - name: Build unsigned AppImage
        env:
          RO_LAUNCHER_DISCORD_APPLICATION_ID: ${{ needs.release-config.outputs.discord_application_id }}
          DISCORD_APPLICATION_ID: ''
          NO_STRIP: 'true'
        run: npx --no-install tauri build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Smoke-test the AppImage that will be published
        id: artifact
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          appimage="RO-Launcher_${version}_amd64.AppImage"
          shopt -s nullglob
          images=(target/release/bundle/appimage/RO-Launcher_*_amd64.AppImage)
          if [[ ${#images[@]} -ne 1 || "${images[0]}" != "target/release/bundle/appimage/$appimage" ]]; then
            echo "::error::expected exactly $appimage, found: ${images[*]:-none}"
            exit 1
          fi
          if [[ -e "${images[0]}.sig" ]]; then
            echo "::error::the build job must not produce an updater signature"
            exit 1
          fi
          mkdir dist-release
          cp "${images[0]}" "dist-release/$appimage"
          scripts/smoke-release-artifact.sh "dist-release/$appimage" dist-release/release-smoke.txt
          (cd dist-release && sha256sum "$appimage" > RO-Launcher_amd64.AppImage.sha256)
          sha256=$(cut -d' ' -f1 dist-release/RO-Launcher_amd64.AppImage.sha256)
          {
            echo "version=$version"
            echo "appimage=$appimage"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-appimage
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      # Installs the lockfile-pinned Tauri CLI. --ignore-scripts: no dependency code runs here.
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-appimage
          path: dist-release

      - name: Require the tested bytes
        env:
          APPIMAGE: ${{ needs.build.outputs.appimage }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "${SHA256}  dist-release/${APPIMAGE}" | sha256sum -c -

      # The only step that receives the private key. It runs the signer and nothing else.
      - name: Sign updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE: ${{ needs.build.outputs.appimage }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY//[[:space:]]/}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY must be non-empty in the release environment"
            exit 1
          fi
          ./node_modules/.bin/tauri signer sign --app-version "$VERSION" "dist-release/$APPIMAGE" > /dev/null
          test -s "dist-release/$APPIMAGE.sig"

      - name: Verify signature against the embedded updater pubkey
        env:
          APPIMAGE: ${{ needs.build.outputs.appimage }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          node scripts/updater-release.mjs verify \
            --file "dist-release/$APPIMAGE" --sig "dist-release/$APPIMAGE.sig" --version "$VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-signature
          path: dist-release/${{ needs.build.outputs.appimage }}.sig
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-appimage
          path: dist-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: updater-signature
          path: dist-release

      - name: Verify tested bytes and updater signature
        env:
          APPIMAGE: ${{ needs.build.outputs.appimage }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          echo "${SHA256}  dist-release/${APPIMAGE}" | sha256sum -c -
          (cd dist-release && sha256sum -c RO-Launcher_amd64.AppImage.sha256)
          node scripts/updater-release.mjs verify \
            --file "dist-release/$APPIMAGE" --sig "dist-release/$APPIMAGE.sig" --version "$VERSION"

      # Mirrors the previous tauri-action output: a draft named "RO-Launcher X.Y.Z" with the
      # AppImage, its .sig, latest.json (linux-x86_64 and linux-x86_64-appimage pointing at the
      # asset API url) and human SHA-256/smoke evidence. Fails if a release already exists.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE: ${{ needs.build.outputs.appimage }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "RO-Launcher ${VERSION}" --notes ''
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            "dist-release/$APPIMAGE" \
            "dist-release/$APPIMAGE.sig" \
            dist-release/RO-Launcher_amd64.AppImage.sha256 \
            dist-release/release-smoke.txt
          url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name == \"$APPIMAGE\") | .apiUrl")
          node scripts/updater-release.mjs manifest \
            --file "dist-release/$APPIMAGE" --sig "dist-release/$APPIMAGE.sig" \
            --version "$VERSION" --url "$url" --out dist-release/latest.json
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" dist-release/latest.json
